name: Android Release Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing. Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing. Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: PLAY_SERVICE_ACCOUNT_JSON secret is missing. Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import base64, os
          data = os.environ.get('ANDROID_KEYSTORE_BASE64', '').strip()
          print(f'Secret string length: {len(data)} characters')
          if not data:
              raise ValueError('Keystore base64 secret is empty!')
          decoded = base64.b64decode(data)
          print(f'Decoded binary size: {len(decoded)} bytes')
          open('android/app/release.keystore', 'wb').write(decoded)
          "
          ls -lh android/app/release.keystore

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "storeFile=release.keystore" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=turing-key" >> android/key.properties
          echo "keyPassword=$KEYSTORE_PASSWORD" >> android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: |
          # Calculate an incrementing build number with an offset of 100 to prevent conflicts with old version codes
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          echo "Building with Version Code (Build Number): $BUILD_NUMBER"
          flutter build appbundle --release --build-number=$BUILD_NUMBER --build-name="1.0.$BUILD_NUMBER" --dart-define=dart.library.io.force_staggered_ipv6_lookup=true


      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.scoreboard_central.turing_machine_card
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
